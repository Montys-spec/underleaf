name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Type checks and tests need no Electron binary, so skip install scripts.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
